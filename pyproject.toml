[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phys4dgs"
version = "0.1.0"
description = "Physics-based 4D Gaussian Splatting with multi-material simulation"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
